name: "Label Milestone PR"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  label-milestone:
    if: startsWith(github.head_ref, 'milestone/')
    name: Assign version label based on commit analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: astral-sh/setup-uv@v5

      - name: Determine and assign version label
        run: >-
          uv run python .github/scripts/label-milestone-pr.py
          --token "${{ secrets.GITHUB_TOKEN }}"
          --repo "${{ github.repository }}"
          --pr-number "${{ github.event.pull_request.number }}"
