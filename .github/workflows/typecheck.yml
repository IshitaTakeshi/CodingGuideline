name: "Type Check"

on:
  push:
  pull_request:

jobs:
  mypy:
    name: mypy --strict
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run mypy
        run: uv run python -m mypy github_scripts/ .github/scripts/label-milestone-pr.py
